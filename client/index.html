<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LA CTF</title><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="yes" name="mobile-web-app-capable"/><meta content="yes" name="apple-mobile-web-app-capable"/><link href="https://static.lac.tf/favicon.ico" rel="shortcut icon"/><meta content="Platform | LA CTF" name="title"/><meta content="Platform | LA CTF" property="og:title"/><meta content="Platform | LA CTF" name="twitter:title"/> <meta content="LA CTF is a jeopardy-style capture-the-flag (CTF) cybersecurity competition hosted by ACM Cyber at UCLA &amp; Psi Beta Rho!" name="description"/><meta content="website" property="og:type"/><meta content="https://static.lac.tf/lactf-banner.gif" property="og:image"/><meta content="LA CTF is a jeopardy-style capture-the-flag (CTF) cybersecurity competition hosted by ACM Cyber at UCLA &amp; Psi Beta Rho!" property="og:description"/><meta content="https://platform.lac.tf" property="og:url"/><meta content="summary_large_image" name="twitter:card"/><meta content="LA CTF is a jeopardy-style capture-the-flag (CTF) cybersecurity competition hosted by ACM Cyber at UCLA &amp; Psi Beta Rho!" name="twitter:description"/><meta content="https://static.lac.tf/lactf-banner.gif" name="twitter:image"/><meta content="https://platform.lac.tf" name="twitter:url"/><link href="https://platform.lac.tf" rel="canonical"/><meta content="#f44d8a" name="theme-color"/><meta content="{&quot;meta&quot;:{&quot;description&quot;:&quot;LA CTF is a jeopardy-style capture-the-flag (CTF) cybersecurity competition hosted by ACM Cyber at UCLA &amp; Psi Beta Rho!&quot;,&quot;imageUrl&quot;:&quot;https://static.lac.tf/lactf-banner.gif&quot;,&quot;title&quot;:&quot;Platform | LA CTF&quot;},&quot;homeContent&quot;:&quot;&lt;!--[lactf div class=\&quot;lactf-hero\&quot;]--&gt;\n\n![LACTF Banner](https://static.lac.tf/images/LongLogoWavingTransparentBig.gif)\n\n&lt;timer&gt;&lt;/timer&gt;\n\n&lt;!--[lactf div class=\&quot;lactf-sponsors card\&quot;]--&gt;\n\n## Sponsors\nLA CTF would not be possible without all of these amazing sponsors!\n\n&lt;sponsors&gt;&lt;/sponsors&gt;\n\n&lt;!--[lactf /div]--&gt;\n\n&lt;!--[lactf div class=\&quot;lactf-rules card\&quot;]--&gt;\n\n## Eligibility\nAnyone can participate in LA CTF (except organizers, ACM Cyber officers, and challenge authors). However, due to various reasons, we can only award prizes to teams with a United States-based point-of-contact, and in the form of US Amazon Gift Cards. In order for a team to be eligible for UCLA-specific prizes, all members of the team must be current UCLA students.\n\n## Rules\n1. You may use any tool, subject to the restrictions below, at your disposal to attempt to solve the problems. We especially encourage the use of free and open-source tools. Google is your best friend!\n2. During the competition, each person may only be a part of **one team** total, and only members of a given team may assist in solving a challenge for that team. Do not share flags, challenge solutions, tips, hints, or otherwise implicitly or explicitly leak information about solving challenges outside your team until after the CTF is over.\n3. Each team must have a valid email address that should serve as the point of contact. UCLA students should use a @g.ucla.edu email to register for access to the UCLA-only division.\n4. There are two divisions for teams, **UCLA** and **Open**. Teams in the UCLA-only division may consist of up to **four** participants, all of which must be **current UCLA students**. Open division teams have no team size or makeup restrictions. UCLA students may choose to participate in either division but not both.\n5. No flag or hint sharing. Do **not** solicit or accept hints or guidance from any person except through official support channels. You are allowed to use technologies such as ChatGPT or Google Gemini to assist you, though please do not open a support ticket asking why the hallucinated flag from ChatGPT isn't working.\n6. Do **not** attempt to attack or interfere with other teams or any servers used in this competition that are not explicitly designated for being hacked in a problem. Do not perform any sort of online bruteforce against any of our systems including challenges, such as dirbuster or nmap - it won't help. Do not attempt to solve challenges before the CTF has started. If you ever have a question about whether something is allowed, please ask!\n7. Flags are of the format `lactf{TEXT_HERE}` unless otherwise noted on the challenge description. No brute-force guessing flags. Feel free to try several flags if you're not sure, but don't try any sort of brute forcing on the scoreboard platform. If you think a flag is valid but the system isn't taking it, please contact us using one of the methods below and we'd be happy to help.\n8. Finally, **have fun and try and learn something new**!\n\n## Scoring\n1. Each problem has a point value listed. Team rankings are decided by number of points, highest to lowest. If two teams have the same number of points, the tiebreak is which team reached their top score first, excluding trivial category challenges.\n2. Challenges are subject to **dynamic scoring**: the **more** teams that solve a particular challenge, the **less** points that challenge will be worth to **all** teams who solved the challenge. There is no time score bonus awarded.\n3. The prize winning teams will be contacted by us after the contest ends. Please make sure the email used to register the team is the email you'd like us to contact. **Note: Prizes are in the form of US Amazon Gift Cards**.\n4. Teams **must** solve the `welcome/rules` challenge in order to be eligible to win prizes as a confirmation they have read and agree to the rules. The flag to solve this challenge is `lactf{on_behalf_of_my_team_i_understand_and_agree_to_the_rules}`.\n5. We reserve the right to require write-ups from the winning teams for any problems we choose as proofs of solution.\n6. In the event that a team that is ineligible for prizes wins a prize, the next eligible team will recieve that prize. It may take some time for prizes to settle; please be patient!\n7. Anyone who violates these rules will be disqualified. **All decisions made by LA CTF organizers are final**.\n\n## Prizes\nPlease see [https://lac.tf/#prizes](https://lac.tf/#prizes) for more information about prizes.\n\n## Support\nIf at any point you need to contact us during the competition, please join us in discord at [https://lac.tf/discord](https://lac.tf/discord) and use the #support channel for quick support.\nFor private questions before the competition starts, please email [uclacyber+lactf@gmail.com](mailto:uclacyber+lactf@gmail.com).\n\n&lt;br/&gt;\n\n\n&lt;!--[lactf /div]--&gt;\n&quot;,&quot;sponsors&quot;:[{&quot;name&quot;:&quot;Verkada&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/verkada.png&quot;,&quot;description&quot;:&quot;Protect people and places in a privacy-sensitive way. Trusted by over 33,000 organizations, Verkada builds physical security solutions that integrate seamlessly behind a single, cloud-based software platform.&quot;,&quot;url&quot;:&quot;https://www.verkada.com/&quot;},{&quot;name&quot;:&quot;OtterSec&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/ottersec.png&quot;,&quot;description&quot;:&quot;OtterSec is the leading blockchain security audit team, working closely with various Layer 1s and the protocols built on them.&quot;,&quot;url&quot;:&quot;https://osec.io/&quot;},{&quot;name&quot;:&quot;Zellic&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/zellic.png&quot;,&quot;description&quot;:&quot;Zellic is a security research firm. We hire talented hackers to break critical software, ranging from virtual machines to compilers and major web apps to proof systems. Before Zellic, we founded perfect blue, the #1 CTF team in 2020 and 2021. We offer a comprehensive benefits package and direct equity participation, as well as flexible hours, remote work, and both full-time and part-time roles. To learn more about Zellic, check out our blog: zellic.io/auditooor-grindset. Work at Zellic: jobs@zellic.io | @gf&amp;#95;256&quot;,&quot;url&quot;:&quot;https://www.zellic.io/&quot;},{&quot;name&quot;:&quot;Trail of Bits&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/trail-of-bits.png&quot;,&quot;description&quot;:&quot;Trail of Bits helps secure the world's most targeted organizations and products. We combine high-end security research with a real-world attacker mentality to reduce risk and fortify code.&quot;,&quot;url&quot;:&quot;https://www.trailofbits.com/&quot;},{&quot;name&quot;:&quot;Amber by LatticeWork&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/latticework.png&quot;,&quot;description&quot;:&quot;Store your data locally and access it from anywhere without subscription fees!&quot;,&quot;url&quot;:&quot;https://www.myamberlife.com/&quot;},{&quot;name&quot;:&quot;Google Cloud&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/google_cloud.png&quot;,&quot;description&quot;:&quot;Meet your business challenges head on with cloud computing services from Google, including data management, hybrid &amp; multi-cloud, and AI &amp; ML. Infra sponsored by goo.gle/ctfsponsorship&quot;,&quot;url&quot;:&quot;https://goo.gle/ctfsponsorship&quot;},{&quot;name&quot;:&quot;OffSec&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/offsec.png&quot;,&quot;description&quot;:&quot;OffSec is a global leader in cybersecurity education, built on a commitment to excellence, integrity, and growth. The OffSec User Generated Content Program is a space built for creators like you. Turn your ideas into real labs that thousands of learners worldwide will use to practice and grow their skills.&quot;,&quot;url&quot;:&quot;https://www.offsec.com/community/ugc/&quot;},{&quot;name&quot;:&quot;Vector 35 - Binary Ninja&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/binary-ninja.png&quot;,&quot;description&quot;:&quot;Binary Ninja is an interactive decompiler, disassembler, debugger, and binary analysis platform built by reverse engineers, for reverse engineers. Developed with a focus on delivering a high-quality API for automation and a clean and usable GUI, Binary Ninja is in active use by malware analysts, vulnerability researchers, and software developers worldwide.&quot;,&quot;url&quot;:&quot;https://binary.ninja/&quot;},{&quot;name&quot;:&quot;Black Hills Information Security&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/bhis.png&quot;,&quot;description&quot;:&quot;At Black Hills Information Security (BHIS), we strive to strengthen our customers' information security infrastructure and employees through penetration testing, consulting, and defensive security services. Since our founding in 2008, companies of all sizes, from small community banks to Fortune 100 companies, have entrusted us with their business.&quot;,&quot;url&quot;:&quot;https://www.blackhillsinfosec.com/&quot;},{&quot;name&quot;:&quot;Hex-Rays&quot;,&quot;icon&quot;:&quot;https://static.lac.tf/sponsors/hex-rays.png&quot;,&quot;description&quot;:&quot;IDA is the leading tool for binary analysis, trusted by top cybersecurity teams for reverse engineering and malware defense. Simplify complex binaries and boost your security processes with its advanced analysis features.&quot;,&quot;url&quot;:&quot;https://hex-rays.com/&quot;}],&quot;ctfName&quot;:&quot;LA CTF&quot;,&quot;divisions&quot;:{&quot;ucla&quot;:&quot;UCLA&quot;,&quot;open&quot;:&quot;Open&quot;},&quot;origin&quot;:&quot;https://platform.lac.tf&quot;,&quot;lactfPostTime&quot;:1768118400000,&quot;startTime&quot;:1770429600000,&quot;endTime&quot;:1770602400000,&quot;emailEnabled&quot;:true,&quot;userMembers&quot;:true,&quot;faviconUrl&quot;:&quot;https://static.lac.tf/favicon.ico&quot;,&quot;recaptcha&quot;:{&quot;siteKey&quot;:&quot;6LfjB34jAAAAAJlPsXGmbh5YiUnkzMVuZ7a79m68&quot;,&quot;protectedActions&quot;:[&quot;register&quot;,&quot;recover&quot;,&quot;setEmail&quot;]},&quot;instancerUrl&quot;:&quot;https://instancer.lac.tf&quot;}" name="rctf-config"/></head><body><% preact.bodyEnd %></body></html>
